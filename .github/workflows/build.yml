name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derle
        run: mvn -B package

      - name: Jar dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: ArenaRegen
          path: target/ArenaRegen.jar

      - name: Release olustur (v* tag'i icin)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ArenaRegen.jar
